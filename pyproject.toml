[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec"
version = "0.1.0"
description = "Quantum error correction from first principles: repetition codes and the rotated surface code, minimum-weight perfect matching decoding, and the measured error-correction threshold"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Be24002" }]
keywords = ["quantum-computing", "error-correction", "surface-code", "mwpm", "monte-carlo", "threshold"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
